# 1. DB接続情報（Render環境とローカル両方に対応）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workout_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:isayamayuto}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:your_password}

# 2. パフォーマンス改善（接続を常に2つキープして、"ワンテンポ"を解消）
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# 3. Hibernate/JPA設定（データを保持し、PostgreSQLに最適化）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. サーバーポート（Renderの要求に合わせる）
server.port=${PORT:8080}